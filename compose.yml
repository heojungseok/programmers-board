services:
  db:
    image: postgres:17
    container_name: programmers-board-db
    environment:
      POSTGRES_USER: sa
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: board-db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev-board:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  dev-board:
